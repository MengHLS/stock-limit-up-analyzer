      - research_run (18)
      - research_analysis (352)
      - research_analysis_condition (735)
      - research_analysis_metric (0)
      - research_result (6680)
      - research_conclusion (15)
      - research_strategy_candidate (13)
      - research_artifact (0)
      - research_finding (68) / research_question (3) / research_plan (3)
    tests:
