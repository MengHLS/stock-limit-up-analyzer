# .agent/task-state.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Orchestrator 当前 Goal 的过程状态（唯一运行时状态文件）。
#   - 只描述「当前 Goal」；不保存长期业务知识，不替代 AGENTS.md / ROADMAP.md。
#   - 不保存模型内部推理；只记录可核对的事实（阶段 / 状态 / 证据 / 下一步）。
#   - 每个 Goal 开始时初始化，每个重要阶段完成后更新，允许每个 Goal 覆盖更新。
#   - 该文件不参与业务逻辑；server/** 与 client/** 代码一律不得读取它。
#
# 规则与合法转换见 .agents/orchestrator/SKILL.md §5 / §6。
#   goal.status  ∈ ACTIVE | COMPLETE | BLOCKED | NEEDS_HUMAN        （Goal 级）
#   stage.status ∈ PENDING | READY | IN_PROGRESS | COMPLETE | BLOCKED | NEEDS_HUMAN
# ─────────────────────────────────────────────────────────────────────────────

