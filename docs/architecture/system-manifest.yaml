  #    另注：v2.5.0 在仓库任何文件中都没有登记（观测到的断号，如实登记，不回填臆造条目）。
  baselineHistory: ["v1.0.0 (2026-09-19 SYSTEM-BASELINE-001)", "v1.1.0~v1.4.0 (PARAMETER-001/002, ROBUSTNESS-001, OOS-001, WALK-FORWARD-001)", "v2.0.0 (2026-09-20 round-2: PHASE-A/R1/B/D + 判定日数据流变更)", "v2.1.0 (2026-10-03 SCOPE-002 策略创作工作台)", "v2.2.0 (2026-10-04 STRATEGY-T74-FORMALIZATION-001)", "v2.3.0 (2026-10-04 ENTRY-CONDITION-SLOTS-001)", "v2.6.0 (2026-10-05 T74-LATE-ENTRY-P8-001 延迟入场 + 晚窗口滚动 3F)", "v2.7.0 (2026-10-05 T74-EVENT-GATE-P9-001 事件事实 gate)", "v2.4.0 (2026-10-11 FIRSTBOARD-ROLLING-POOL-RECOVERY-ST-FIX-005: SimulationConfig.executionEligibilityGate 可选执行资格闸门 + ST_GATE_CONTRACT_VERSION 1.1.0 区间语义；⚠️ BASELINE_DRIFT：本条目由本文件自身陈旧的 v2.3.0 递增而来，未接续基线链的 v2.7.0；内容已并入 v2.8.0，编号保留)", "v2.8.0 (2026-10-11 FIRSTBOARD-ROLLING-POOL-RECOVERY-ST-FIX-005 续修: 新增权威装配配置入口 assembleCompositeRunnerSimulationConfig（composite-assembly-config/1.0.0，只装配不撮合 + 配置指纹）；辅助装配路径不再顺带撮合 ⇒ 隔夜 ST 在辅助路径同样买不进；同时把本文件与 SYSTEM-BASELINE.md 的版本链合并统一到 v2.8.0)", "v2.9.0 (2026-10-11 FIRSTBOARD-ROLLING-POOL-RECOVERY-LIGHT-ST-007: 可选 UNKNOWN 处理声明 SimulationConfig.executionEligibilityUnknownPolicy（缺省 REJECT；仅显式 ALLOW_WHEN_DECISION_ALLOWS 且 allowed=true 且 status=UNKNOWN 才放行；ST 恒拒绝；审计保留真实 UNKNOWN、绝不改写 NORMAL）+ 探索性轻量 ST 资格政策 KNOWN_ST_ONLY_EXPLORATORY / recovery-known-st-only/1.0.0（UNKNOWN 可参与、仅排除已有历史记录中的 ST；不伪造 availableAsOf、不改 availability/confidence、不把缺席派生成 NORMAL）+ 只读标签索引端口 loadKnownStLabelIndex；缺省仍为原严格政策，stGate.ts 严格契约 1.1.0 零改动；0 表 / 0 列 / 0 migration)"]
