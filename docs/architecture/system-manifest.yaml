    knownRisks:
      - "R-01 已收口（2026-09-19 / 9bs）：搜索结果落库三表，历史 Run 可回看 / 续跑 / 重试"
      - "R-05 已修复（2026-09-19 / 9bs）：搜索域派生改读 parameterRole ⇒ FIXED 不进搜索空间、DERIVED 不得直接搜索（判据与 listSearchableParameters 等价，有守护测试）"
      - "N-02 已定性（2026-09-19 / 9bt）= 情况 D：参数「声明在 schema 里」≠「决策引擎会读它」；判据 = strategyCore/ruleGraph.ts#collectRuleParameterReferences。createSearch 已加死参数护栏（PARAMETER_SEARCH_NO_REFERENCED_TUNABLE_PARAMETER + OVERRIDE_ON_UNREFERENCED_PARAMETER）；顺序纪律 = 派生 → 覆盖 → 死参数剥离 → 校验"
      - "N-01 已修复（2026-09-19 / 9bt）：createSearch 前置窗口校验（dataset_version 日期按北京业务日）⇒ PARAMETER_SEARCH_WINDOW_OUT_OF_DATASET_RANGE"
      - "N-05 收敛状态（2026-09-19 / 9bt）：parameterSpaceFromDocument.ts = LEGACY/PREVIEW（消费者 = 技术预览端点 + 闭环 optimization 阶段，后者只持有 document、拿不到 role 投影行）；parameterSearch/searchSpace.ts = PS 唯一使用，静态源码守卫测试钉住"
      - "遗留：parameter_search_result.backtestRunId 恒 NULL（评估端口走内存态 5 阶段闭环、不落 closed_loop_backtest_run 行）；追溯改用 backtestFingerprint + evaluationId + Run 坐标（N-03 = DEFERRED）"
