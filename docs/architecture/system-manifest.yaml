    sourcePaths:
      - server/datasetRegistry/**          # A 体系（权威，17 文件）
      - shared/datasetRegistryContracts.ts # wire 契约
      - server/runWorkbenchAssembly/datasetFromRegistry.ts # A→研究链唯一读桥
      - server/researchDataset/**          # B 体系（LEGACY）
      - server/research/datasetAccess/**   # B 体系访问层（LEGACY）
    entryPoints:
      - server/datasetRegistry/registry.ts#DatasetRegistryService.createVersionWithBuildConfig
      - server/datasetRegistry/runner.ts#DefaultDatasetBuildRunner.start
      - server/datasetRegistry/query.ts#DatasetQueryService
      - server/datasetRegistry/router.ts#buildDatasetRegistryRouter  # 24 procedures
    inputs:
      - stock_daily_prices
      - research_securities
      - research_security_status_history
      - industry_assignments
      - liquidity_daily
      - index_daily (交易日历唯一来源)
      - FirstLimitPullbackBuildConfig
    outputs:
      - dataset_version row (status READY)
      - ds_first_limit_pullback_{event,prefix,post,path,outcome}
      - DatasetVersionCounts (totalRows = 五表行数之和)
    consumers: [research, backtest, frontend]
    persistence:
      - dataset_definition (1)
      - dataset_version (2)
      - dataset_build_job (4)
      - dataset_build_config (2) + _event + _board
      - ds_first_limit_pullback_event (25108)
      - ds_first_limit_pullback_prefix (527268)
      - ds_first_limit_pullback_post (487692)
      - ds_first_limit_pullback_path (487692)
      - ds_first_limit_pullback_outcome (75324)
    tests:
      - tests/server/datasetRegistry/**
      - tests/server/researchDataset/**
      - tests/server/research/datasetAccess/**
      - tests/shared/datasetRegistryContracts.test.ts
      - tests/client/src/adapters/datasetRegistryAdapter.test.ts
    knownRisks:
      - "桥仅支持单一 datasetCode first_limit_pullback (datasetFromRegistry.ts:978)"
      - "prefix/post 物理表不在 drizzle migration 链内（双源漂移）"
      - "未注册插件 code 构建抛 BUILDER_NOT_REGISTERED"
      - "读路径列清单非插件化（query.ts:90-104）"
    legacyPaths:
      - server/researchDataset/**（B 体系，内容寻址串 + research_datasets）
      - rd_rows_05809b1a6d97aa02 / rd_rows_5dce9db1421bec38
    verifiedFacts:
      - "五表记账闭合：1,603,084 = v1 60,002 + v2 1,543,082，差 0"
      - "event 25108 + prefix 527268 + post 487692 + path 487692 + outcome 75324 = 1603084"

