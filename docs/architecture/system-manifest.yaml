# system-manifest.yaml — 机器可读架构基线
# 由 SYSTEM-BASELINE-001 建立；与 SYSTEM-BASELINE.md 同源同版本。
# 纪律：所有字段值必须来自真实代码/真实库实查，不得虚构。
# 归属标记（owner marker）：FACT | DESIGN | PLANNED | LEGACY | BLOCKED | DEPRECATED | OBSERVED

system:
  name: stock-limit-up-analyzer
  baselineVersion: v1.0.0
  auditedAt: "2026-09-19"
  lastChangeAt: "2026-09-19"
  stack:
    frontend: React 19 + Vite 7 + wouter + tRPC client + Tailwind
    backend: Express + tRPC 11
    orm: Drizzle ORM (mysql2 / TiDB Cloud)
    test: Vitest (node environment)
  scale:
    serverFiles: 628
    clientFiles: 215
    testFiles: 276
    docsFiles: 534
    scriptsFiles: 110
    schemaDeclaredTables: 60
    realBaseTables: 63
    migrations: 41
    appRoutes: 33
    trpcTopLevelRouters: 21
  authority:
    masterControl: ROADMAP.md
    evidenceHierarchy: ["real DB", "actual runtime", "actual code", "automated tests", "docs", "design assumptions"]
  invariants:
    - "canonicalMetrics 是 Backtest 的唯一指标来源"
    - "Evaluation 在已有 canonical 时不得重新计算重叠指标"
    - "NOT_AVAILABLE 不得被评估器数值顶替"
    - "strategy_versions.strategyDocumentJson 是策略定义唯一 SoT；5 张投影表只能单向派生"
    - "datasetVersionId 是运行时唯一权威数据集坐标"
    - "禁止 db:push / drizzle-kit generate / 手写 _journal.json"
    - "历史 Run 不回填"
    - "未装配阶段必须以 CL_RUNNER_NOT_INJECTED 如实 BLOCKED"
    - "client/** 不得 import server/** 运行时值（仅 import type 允许）"

domains:

